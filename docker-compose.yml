services:

  ai_services:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    container_name: travis-ai-services
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./knowledge_base:/knowledge_base:ro
      - hf_cache:/app/.cache/huggingface
      - st_cache:/app/.cache/sentence_transformers
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache/sentence_transformers
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travis-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    # Removed: hardcoded AI_BASE_URL and NODE_ENV — both come from .env via env_file
    depends_on:
      ai_services:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ${REACT_APP_API_URL} reads from .env — no hardcoded fallback here
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    container_name: travis-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  hf_cache:
  st_cache: